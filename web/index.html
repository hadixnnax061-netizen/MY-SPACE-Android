  const target=Math.max(1,+t.weeklyTarget||1),now=new Date();now.setHours(0,0,0,0);const monday=d=>{const q=new Date(d);q.setDate(q.getDate()-((q.getDay()+6)%7));q.setHours(0,0,0,0);return q};let week=monday(now);

async function requestGeminiReply(s,kind){

 let data={};try{data=await response.json()}catch(_){}
 if(!response.ok)throw new Error(data.error||`فشل الاتصال بـ Gemini (${response.status})`);

}
async function speakGemini(text,kind){

const IMG={};
function img(u){if(!u)return null;let i=IMG[u];if(!i){i=IMG[u]=new Image();i.src=u}return i.complete&&i.naturalWidth?i:null}
function CORE(x,P,r,ang,t,cg,W,poly){
 const sh=P.shape,n=Math.max(3,Math.round(P.sides||6)),dt=(P.detail==null?40:P.detail)/100,sd=P.seed||7,R=i=>{const v=Math.sin((i+sd)*127.1)*43758.5453;return v-Math.floor(v)};
 const disc=()=>{x.beginPath();x.arc(0,0,r,0,7)};
 const shade=()=>{const g=x.createRadialGradient(-r*.4,-r*.4,r*.1,0,0,r*1.15);g.addColorStop(0,'rgba(255,255,255,.2)');g.addColorStop(.55,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=g;disc();x.fill()};
 const dash=()=>{disc();x.setLineDash([4,4]);x.strokeStyle=P.c1;x.stroke();x.setLineDash([])};
 if(sh=='image'&&P.tmode=='flat'){const im=img(P.tex);if(!im){dash();return true}const w=r*2.5,h=w*im.naturalHeight/im.naturalWidth;x.rotate(Math.sin(ang*.4)*.12);x.drawImage(im,-w/2,-h/2,w,h);return true}
 if(sh=='sphere'||sh=='image'){x.fillStyle=cg;disc();x.fill();x.shadowBlur=0;x.save();disc();x.clip();
  if(sh=='image'){const im=img(P.tex);if(im){const s2=r*4.4,o=(ang*r*.5)%s2;for(let q=-1;q<=1;q++)x.drawImage(im,-s2/2+o+q*s2,-r*1.1,s2,r*2.2)}}
  else{const sf=P.surf||'smooth',lon=i=>R(i)*6.283+ang*.6;
   if(sf=='bands'){for(let i=0;i<9;i++){const y=-r+(i+R(i)*.7)*r*.22,h=r*(.07+R(i+9)*.16)*(.5+dt);x.fillStyle=rgba(i%3?P.c2:i%2?P.c3:P.c1,.18+.4*dt);x.beginPath();for(let k=0;k<=12;k++){const yy=y+Math.sin(k*.9+t*.6+i)*r*.03*dt*3;k?x.lineTo(-r+k*r/6,yy):x.moveTo(-r,yy)}for(let k=12;k>=0;k--)x.lineTo(-r+k*r/6,y+h+Math.sin(k*.9+t*.6+i)*r*.03*dt*3);x.closePath();x.fill()}}
   else if(sf=='craters'||sf=='land'){const N=4+Math.round(dt*14);for(let i=0;i<N;i++){const lo=lon(i),c=Math.cos(lo);if(c<=0)continue;const la=(R(i+3)-.5)*2.2,px=r*Math.cos(la)*Math.sin(lo),py=r*Math.sin(la),s=r*(sf=='land'?.12+R(i+5)*.3:.05+R(i+5)*.13)*c;if(sf=='land'){x.fillStyle=rgba(i%2?P.c3:P.c1,.55);x.beginPath();x.ellipse(px,py,s*1.3,s*.8,R(i)*3,0,7);x.fill()}else{x.fillStyle='rgba(0,0,0,.32)';x.beginPath();x.ellipse(px,py,s,s*.8,0,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=1;x.stroke()}}}
   else if(sf=='cracks'){x.strokeStyle=rgba(P.c3,.9);x.lineWidth=Math.max(1,r*.025);x.shadowColor=P.c3;x.shadowBlur=6;const N=3+Math.round(dt*8);for(let i=0;i<N;i++){const lo=lon(i);if(Math.cos(lo)<=0)continue;const la=(R(i+3)-.5)*2;let px=r*Math.cos(la)*Math.sin(lo),py=r*Math.sin(la);x.beginPath();x.moveTo(px,py);for(let k=1;k<5;k++){px+=(R(i*7+k)-.5)*r*.4;py+=(R(i*5+k)-.2)*r*.3;x.lineTo(px,py)}x.stroke()}x.shadowBlur=0}
   else if(sf=='swirl'){x.strokeStyle=rgba(P.c3,.5);x.lineWidth=r*.05;x.beginPath();for(let k=0;k<70;k++){const a=k*.28-t*.6,rd=r*k/60*(.8+dt*.3);x.lineTo(Math.cos(a)*rd,Math.sin(a)*rd*.9)}x.stroke()}}
  shade();x.restore();{const rg=x.createRadialGradient(0,0,r*.9,0,0,r*1.25);rg.addColorStop(0,rgba(P.c1,0));rg.addColorStop(.35,rgba(P.c1,.35));rg.addColorStop(1,rgba(P.c1,0));x.fillStyle=rg;x.beginPath();x.arc(0,0,r*1.25,0,7);x.fill()}return true}
 if(sh=='crystal'){const p=[];for(let i=0;i<n;i++){const a=ang+i*6.2832/n;p.push([Math.cos(a)*r*1.15,Math.sin(a)*r*1.15])}x.fillStyle=cg;x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();x.shadowBlur=0;for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n],lt=.5+.5*Math.sin(ang*2+i);x.fillStyle=i%2?rgba('#ffffff',.14+.2*lt):rgba('#000000',.12+.2*(1-lt));x.beginPath();x.moveTo(0,0);x.lineTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.closePath();x.fill();x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;x.stroke()}x.strokeStyle=rgba(P.c3,.8);x.beginPath();for(let i=0;i<n;i++){const a=-ang*1.3+i*6.2832/n;i?x.lineTo(Math.cos(a)*r*.5,Math.sin(a)*r*.5):x.moveTo(Math.cos(a)*r*.5,Math.sin(a)*r*.5)}x.closePath();x.stroke();return true}
 if(sh=='geo'){const L=2+Math.round(dt*3);x.strokeStyle=P.c1;x.lineWidth=1.5*W/320;x.fillStyle=rgba(P.c2,.3);poly(n,r*1.2,ang,0);x.fill();let prev=null;for(let l=0;l<L;l++){const rr=r*(1.2-l*.9/L),a0=ang*(l%2?-1:1)+l*.5,cu=[];x.beginPath();for(let i=0;i<n;i++){const a=a0+i*6.2832/n,q=[Math.cos(a)*rr,Math.sin(a)*rr];cu.push(q);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.closePath();x.stroke();if(prev){x.globalAlpha=.5;x.beginPath();cu.forEach((q,i)=>{x.moveTo(prev[i][0],prev[i][1]);x.lineTo(q[0],q[1])});x.stroke();x.globalAlpha=1}prev=cu}return true}
 if(sh=='star'){x.fillStyle=cg;poly(n*2,r*1.35,ang,.3+.35*(1-dt));x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(0,0,r*.28,0,7);x.fill();return true}
 if(sh=='spiral'){x.shadowBlur=0;const arms=Math.max(2,Math.round(n/2)),K=110;for(let a=0;a<arms;a++)for(let k=0;k<K;k++){const f=k/K,th=f*5+a*6.2832/arms+ang*1.5,rd=r*1.5*f,j=(R(a*200+k)-.5)*r*.35*dt;x.fillStyle=rgba(mix(P.c1,P.c3,f*100),.8-f*.5);x.beginPath();x.arc(Math.cos(th)*rd+j,Math.sin(th)*rd*.6+j*.5,(1.6-f)*W/320*1.4,0,7);x.fill()}const g=x.createRadialGradient(0,0,0,0,0,r*.6);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.4,rgba(P.c1,.6));g.addColorStop(1,rgba(P.c1,0));x.fillStyle=g;x.beginPath();x.arc(0,0,r*.6,0,7);x.fill();return true}
 if(sh=='hole'){x.shadowBlur=0;const tl=((P.tilt==null?50:P.tilt)-50)/60,dk=(a2)=>{x.save();x.rotate(tl);for(let k=0;k<6;k++){const rr=r*(1.15+k*.18);x.strokeStyle=rgba(k%2?P.c3:P.c1,.75-k*.1);x.lineWidth=r*.1;x.beginPath();x.ellipse(0,0,rr,rr*.28,0,0,a2);x.stroke()}x.restore()};dk(6.29);x.fillStyle='#000';x.shadowColor=P.c1;x.shadowBlur=r*.8;x.beginPath();x.arc(0,0,r*.72,0,7);x.fill();x.shadowBlur=0;x.strokeStyle=rgba(P.c1,.9);x.lineWidth=2;x.stroke();dk(Math.PI);return true}
 if(sh=='flower'){x.shadowBlur=0;const N=n+2;x.globalCompositeOperation='lighter';for(let i=0;i<N;i++){x.save();x.rotate(ang+i*6.2832/N);const g=x.createLinearGradient(0,0,r*1.4,0);g.addColorStop(0,rgba(P.c1,.8));g.addColorStop(1,rgba(P.c2,.15));x.fillStyle=g;x.beginPath();x.ellipse(r*.75,0,r*.75,r*(.18+.25*dt),0,0,7);x.fill();x.restore()}x.globalCompositeOperation='source-over';x.fillStyle=P.c3;x.shadowColor=P.c3;x.shadowBlur=r*.5;x.beginPath();x.arc(0,0,r*.25,0,7);x.fill();return true}
