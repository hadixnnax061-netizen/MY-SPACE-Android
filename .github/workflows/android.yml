name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MYSPACE_KEYSTORE_BASE64: ${{ secrets.MYSPACE_KEYSTORE_BASE64 }}
      MYSPACE_KEYSTORE_PASSWORD: ${{ secrets.MYSPACE_KEYSTORE_PASSWORD }}
      MYSPACE_KEY_ALIAS: ${{ secrets.MYSPACE_KEY_ALIAS }}
      MYSPACE_KEY_PASSWORD: ${{ secrets.MYSPACE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        if: env.MYSPACE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$MYSPACE_KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          {
            echo "MYSPACE_KEYSTORE=keystore/release.jks"
          } >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect and verify APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MY-SPACE-v16.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/MY-SPACE-v16.1-debug.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$SDK/build-tools/35.0.0"
          if [ ! -x "$BUILD_TOOLS/apksigner" ] && [ -d "$SDK/build-tools" ]; then
            BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          fi
          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose dist/MY-SPACE-v16.1.apk
            "$BUILD_TOOLS/aapt" dump badging dist/MY-SPACE-v16.1.apk | head -5
          else
            echo "apksigner not found; skipping signature print."
          fi
          ls -lh dist
          echo "--- packaged web assets ---"
          unzip -l dist/MY-SPACE-v16.1.apk | grep -E 'assets/www/(index.html|android-bridge.js|manifest.webmanifest)'
          echo "--- permissions ---"
          if [ -x "$BUILD_TOOLS/aapt" ]; then
            "$BUILD_TOOLS/aapt" dump badging dist/MY-SPACE-v16.1.apk | grep 'uses-permission'
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MY-SPACE-APK
          path: |
            dist/MY-SPACE-v16.1.apk
            dist/MY-SPACE-v16.1-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MY SPACE — أحدث إصدار
          body: |
            نسخة Android من MY SPACE v16.1 مبنية تلقائياً من الفرع `main`.

            - الحزمة: `com.myspace.app`
            - الإصدار: 16.1.0
            - يتطلب Android 7.0 (API 24) أو أحدث
            - المفتاح يُخزَّن مشفّراً داخل التطبيق (Android Keystore)

            راجع `README.md` للتفاصيل.
          files: dist/MY-SPACE-v16.1.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MY-SPACE-v16.1.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
