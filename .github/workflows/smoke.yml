name: APK smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  emulator:
    name: Boot emulator and launch APK
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest APK
        run: |
          curl -fL --retry 3 -o app.apk \
            https://github.com/hadixnnax061-netizen/MY-SPACE-Android/releases/latest/download/MY-SPACE-v16.1.apk
          ls -lh app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm dismiss-keyguard
            adb install -r app.apk
            adb shell am start -W -n com.myspace.app/.MainActivity
            sleep 15
            adb shell pidof com.myspace.app
            adb exec-out screencap -p > screenshot.png
            test -s screenshot.png
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -2
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d | tail -150
              exit 1
            fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: MY-SPACE-screenshot
          path: screenshot.png
          if-no-files-found: error

      - name: Attach screenshot to latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload latest screenshot.png --clobber
          -R hadixnnax061-netizen/MY-SPACE-Android
