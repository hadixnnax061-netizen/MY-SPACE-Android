name: APK smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  emulator:
    name: Boot emulator and launch the APK from this workflow run
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Select the Android build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$RUN_EVENT" = "workflow_run" ]; then
            echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh run list --workflow android.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId' \
              -R "$GITHUB_REPOSITORY")
            test -n "$RUN_ID"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact from selected build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-artifact
          gh run download "${{ steps.build.outputs.run_id }}" \
            -R "$GITHUB_REPOSITORY" -n MY-SPACE-APK -D build-artifact
          cp build-artifact/MY-SPACE-v16.2-debug.apk app.apk
          test -s app.apk
          ls -lh app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb shell wm dismiss-keyguard || true
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n com.myspace.app/.MainActivity
            sleep 15
            PID=$(adb shell pidof com.myspace.app | tr -d '\r')
            test -n "$PID"
            adb logcat -d -v threadtime > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              grep -E "FATAL EXCEPTION|AndroidRuntime|com.myspace|MySpace|MYSPACE" logcat.txt | tail -160
              exit 1
            fi
            adb exec-out screencap -p > screenshot.png
            test -s screenshot.png

      - name: Upload screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY-SPACE-smoke-${{ steps.build.outputs.run_id }}
          path: |
            screenshot.png
            logcat.txt
          if-no-files-found: warn
