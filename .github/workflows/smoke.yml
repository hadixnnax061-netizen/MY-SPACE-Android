name: APK smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  emulator:
    name: Boot emulator and launch APK
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest \
            -R hadixnnax061-netizen/MY-SPACE-Android \
            -p 'MY-SPACE-v16.2.apk' -O app.apk --clobber
          ls -lh app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm dismiss-keyguard || true
            adb install -r app.apk || true
            adb logcat -c || true
            adb shell am start -W -n com.myspace.app/.MainActivity || true
            sleep 15
            echo "--- pid ---"
            adb shell pidof com.myspace.app || true
            echo "--- top activity ---"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -2 || true
            echo "--- widget provider ---"
            adb shell dumpsys appwidget | grep -i "com.myspace" || true
            adb shell dumpsys package com.myspace.app | grep -i "PlanetWidgetProvider" || true
            echo "--- crash log ---"
            adb logcat -d -v threadtime > logcat.txt || true
            grep -E "FATAL EXCEPTION|AndroidRuntime|com.myspace|MySpace|MYSPACE" logcat.txt | tail -160 || true
            adb shell input tap 540 700 || true
            sleep 3
            adb exec-out screencap -p > screenshot.png || true
            test -s screenshot.png || true
            grep -q "FATAL EXCEPTION" logcat.txt && exit 1 || true
            adb shell pidof com.myspace.app

      - name: Upload screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY-SPACE-screenshot
          path: |
            screenshot.png
            logcat.txt
          if-no-files-found: warn

      - name: Attach screenshot to latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload latest screenshot.png --clobber
          -R hadixnnax061-netizen/MY-SPACE-Android
